[project]
name = "scrape-kit"
version = "0.1.0"
description = "Polite web scraper (robots.txt, per-host throttling, retries) and resumable bulk downloader with CSV/XLSX export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naufal Kausar" }]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.12", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
scrape-kit = "scrape_kit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scrape_kit"]
